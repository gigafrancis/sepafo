<!-- Lightbox -->
<div id="lightbox" role="dialog" aria-modal="true" aria-label="Photo agrandie">
  <img id="lightbox-img" alt="">
</div>

<script>
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");

const ouvrirLightbox = (img) => {
  lightboxImg.src = img.src;
  lightboxImg.alt = img.alt;
  lightbox.style.display = "flex";
};

const fermerLightbox = () => {
  lightbox.style.display = "none";
  lightboxImg.removeAttribute("src");
};

document.querySelectorAll(".zoomable").forEach(img => {
  img.setAttribute("role", "button");
  img.setAttribute("tabindex", "0");
  img.addEventListener("click", () => ouvrirLightbox(img));
  img.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      ouvrirLightbox(img);
    }
  });
});

lightbox.addEventListener("click", fermerLightbox);

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    fermerLightbox();
  }
});
</script>
